<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erle. – deine Planung.</title>
<style>
:root{--bg:#f6f9fd;--card:#fff;--line:#dbe5f0;--text:#142033;--muted:#718096;--blue:#1769e0;--blueDark:#0d3f91;--blueSoft:#eaf3ff;--red:#9b4a55;--redSoft:#f7f3f4;--yellow:#9a7a1a;--yellowSoft:#fff9e8;--green:#227a59;--greenSoft:#edf8f3}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button,input,select,textarea{font:inherit} button{cursor:pointer} .hidden{display:none!important}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;font-weight:700;color:var(--text);transition:.18s ease}.btn:hover{border-color:#b9cbe0;background:#f8fbff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#0f5fce}.btn.danger{color:#4b5870;border-color:#d8e2ec;background:#f8fafc}.btn.danger:hover{background:#eef4fa;border-color:#c7d6e6}
.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 13px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,111,213,.10)}
.field{display:flex;flex-direction:column;gap:7px} .field label{font-size:13px;font-weight:800}
.muted{color:var(--muted)} .small{font-size:12px} .row{display:flex;gap:10px;align-items:center} .between{display:flex;justify-content:space-between;gap:14px;align-items:center}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}
.badge.red{background:var(--redSoft);color:var(--red)} .badge.yellow{background:var(--yellowSoft);color:#856a0d} .badge.green{background:var(--greenSoft);color:var(--green)} .badge.blue{background:var(--blueSoft);color:var(--blue)}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 20px 55px rgba(20,30,50,.09)}
.brand{display:flex;gap:11px;align-items:center;margin-bottom:26px} .brandmark{width:40px;height:40px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}
.brandtitle{font-size:21px;font-weight:900} .brandsub{font-size:12px;color:var(--muted)}
.login-card .field{margin-bottom:14px} .login-card .btn{width:100%;min-height:46px}
.authswitch{text-align:center;margin-top:13px;font-size:13px} .authswitch button{border:0;background:none;color:var(--blue);font-weight:800}
.notice{border:1px solid #cfe0fb;background:#f7fbff;border-radius:11px;padding:11px 12px;font-size:12px;line-height:1.45}
.error{border:1px solid #f0c3cb;background:#fff6f7;color:#9f2940;border-radius:11px;padding:11px 12px;font-size:12px;line-height:1.45}

/* App shell */
#app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0e4ca7 0%,#0a377b 100%);border-right:1px solid #0a397e;padding:20px 15px;display:flex;flex-direction:column;color:#fff}
.sidebar .brand{margin-bottom:30px}.sidebar .brandmark{width:38px;height:38px;background:#fff;color:var(--blueDark)}.sidebar .brandtitle{color:#fff}.sidebar .brandsub{display:none}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;text-align:left;border-radius:9px;padding:12px 13px;font-weight:700;color:rgba(255,255,255,.82);font-size:14px}
.nav button.active{background:rgba(255,255,255,.16);color:#fff}.nav button:hover{background:rgba(255,255,255,.10);color:#fff}
.sidefoot{margin-top:auto;border-top:1px solid rgba(255,255,255,.16);padding:14px 8px 0}.sidefoot strong{display:block;color:#fff;font-size:13px;font-weight:700}.sidefoot .small{color:rgba(255,255,255,.62)}.sidefoot button{border:0;background:none;padding:9px 0;color:rgba(255,255,255,.75);font-size:12px}
.main{min-width:0} .top{position:sticky;top:0;z-index:20;background:rgba(246,249,253,.94);backdrop-filter:blur(10px);padding:20px 28px 10px}
.topinner{display:flex;gap:10px;justify-content:flex-end} .top .input{max-width:360px} .content{padding:10px 28px 44px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:6px 0 16px} .pagehead h1{margin:0;font-size:29px} .pagehead p{margin:5px 0 0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px} .stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;min-height:70px} .stat strong{font-size:23px;display:block} .stat span{font-size:11px;color:var(--muted)}
.filters{display:flex;gap:7px;margin-bottom:13px;overflow:auto} .filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px} .filter.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Board */
.boardwrap{overflow:auto;padding-bottom:12px} .board{display:grid;grid-template-columns:repeat(4,minmax(280px,1fr));gap:16px;min-width:1160px}
.col{background:#f4f5f6;border:1px solid #e0e6ec;border-radius:15px;padding:12px;min-height:520px} .col.over{outline:2px solid rgba(47,111,213,.35)}
.colhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;font-weight:900} .colcount{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--muted)}
.ordercard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:10px;box-shadow:0 3px 10px rgba(20,30,50,.035);cursor:pointer} .ordercard.dragging{opacity:.5}
.plate{font-size:22px;font-weight:900;letter-spacing:.2px} .vehicle{font-size:14px;font-weight:700;margin-top:4px}.customername{font-size:12px;font-weight:400;color:#94a0b2;line-height:1.35}.cardtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.customer-right{text-align:right;margin-top:3px;max-width:42%;word-break:break-word} .desc{font-size:14px;line-height:1.45;margin:10px 0}
.cardmeta{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px} .statusline{height:4px;border-radius:8px;margin-top:12px} .statusline.planned{background:var(--blue)} .statusline.buy{background:var(--red)} .statusline.working{background:var(--yellow)} .statusline.done{background:var(--green)}

/* tables */
.tablewrap{overflow:auto} table{width:100%;border-collapse:collapse} th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px} th{font-size:12px;color:var(--muted)}

/* Modal */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(31,41,55,.28);display:flex;align-items:center;justify-content:center;padding:28px;backdrop-filter:blur(1px)}
.modal{width:min(880px,calc(100vw - 56px));max-height:calc(100vh - 56px);overflow:auto;background:#fbfbfc;border-radius:19px;box-shadow:0 28px 80px rgba(15,23,42,.22)}
.modalhead{position:sticky;top:0;z-index:3;background:#fbfbfc;border-bottom:1px solid var(--line);padding:19px 22px;display:flex;justify-content:space-between;align-items:center} .modalhead h2{margin:0;font-size:26px}
.modalbody{padding:18px 22px 24px} .close{width:34px;height:34px;border:0;border-radius:9px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px} .section{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin-top:13px} .sectiontitle{font-weight:900;font-size:16px;margin-bottom:12px}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)} .task input[type=checkbox]{width:19px;height:19px} .task.done .tasktitle{text-decoration:line-through;color:var(--muted)}
.partstates{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end} .partbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:800}
.partbtn.missing{background:var(--redSoft);color:var(--red);border-color:#efbac4} .partbtn.available{background:var(--greenSoft);color:var(--green);border-color:#bce0ce} .partbtn.installed{background:#e3f3ea;color:#155f42;border-color:#9fd0b6}
.addrow{display:flex;gap:9px;margin-top:13px} .addrow .input{flex:1} .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.combo{position:relative} .suggestions{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:250px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(20,30,50,.12)} .suggestions button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:10px 12px} .suggestions button:hover,.suggestions button.sel{background:var(--blueSoft);color:var(--blue)}
.toast{position:fixed;right:22px;bottom:22px;z-index:200;background:#182033;color:#fff;border-radius:10px;padding:11px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.2)}

@media(max-width:900px){#app{grid-template-columns:180px minmax(0,1fr)} .sidebar{padding:16px 10px} .nav button{padding:11px 10px} .grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:680px){#app{display:block} .sidebar{display:none} .top,.content{padding-left:12px;padding-right:12px} .stats{display:flex;overflow:auto} .stat{min-width:150px} .modal{width:calc(100vw - 20px);max-height:calc(100vh - 20px)} .backdrop{padding:10px} .task{grid-template-columns:28px 1fr} .partstates{grid-column:2;justify-content:flex-start}}
@media(max-width:680px){
  #app{display:block}
  .sidebar{display:flex;position:sticky;top:0;z-index:40;width:100%;height:auto;padding:10px 10px 8px;flex-direction:column;border-right:0;border-bottom:1px solid rgba(255,255,255,.16)}
  .sidebar .brand{margin:0 0 8px 2px}.sidebar .brandmark{width:30px;height:30px;font-size:15px}.sidebar .brandtitle{font-size:16px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:2px}.nav button{white-space:nowrap;padding:9px 11px;font-size:13px}
  .sidefoot{display:block;padding:7px 2px 0;margin-top:7px}.sideuserrow{gap:8px}.sideidentity{display:none}.logoutbtn{flex:0 0 auto!important;border:1px solid rgba(255,255,255,.55)!important;background:#fff!important;color:#0d3f91!important;border-radius:8px!important;padding:8px 11px!important;font-size:12px!important;font-weight:800!important;box-shadow:0 2px 8px rgba(0,0,0,.10)}
  .top,.content{padding-left:12px;padding-right:12px}
  .top{top:94px}
  .topinner{justify-content:stretch}.top .input{max-width:none;flex:1}
  .stats{display:flex;overflow:auto}.stat{min-width:150px}
  .board{grid-template-columns:repeat(4,minmax(250px,1fr));min-width:1040px}
  .modal{width:calc(100vw - 20px);max-height:calc(100vh - 20px)}
  .backdrop{padding:10px}.grid2,.grid3{grid-template-columns:1fr}

}
.sideuserrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sideidentity{min-width:0;text-align:left}
.sideidentity strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logoutbtn{flex:0 0 auto!important;border:1px solid rgba(255,255,255,.28)!important;background:rgba(255,255,255,.10)!important;color:#fff!important;border-radius:8px!important;padding:7px 9px!important;font-size:11px!important;font-weight:700!important}
.logoutbtn:hover{background:#eef5ff!important;border-color:#fff!important}
.purchase-list{display:flex;flex-direction:column;gap:12px}
.purchase-card{width:100%}
.purchase-items{margin-top:12px}
.purchase-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}

/* Mobile One-Pager */
@media(max-width:680px){
  #app{display:block}
  .sidebar{display:flex;position:sticky;top:0;z-index:50;width:100%;height:auto;padding:10px 12px 9px;flex-direction:column;border-right:0;border-bottom:1px solid rgba(255,255,255,.18)}
  .sidebar .brand{margin:0 0 8px 2px}

.calendar-shell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.calendar-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.calendar-title{font-size:20px;font-weight:900}
.calendar-nav{display:flex;gap:7px}
.calendar-nav button{min-width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px}
.calendar-grid{display:grid;grid-template-columns:44px repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.calendar-cell{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;position:relative;background:#fff}
.calendar-head{min-height:auto;padding:8px 6px;text-align:center;font-size:12px;font-weight:800;color:#6f7a8d;background:#f8fafc}

.calendar-legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}

.calendar-events{margin-top:14px;display:flex;flex-direction:column;gap:8px}

  .event-dot{width:6px;height:6px;right:5px;top:5px}

/* Clean 2025/26 Design Refresh – Farben & Informationsarchitektur bleiben */
:root{
  --bg:#f7f9fc;
  --card:#ffffff;
  --line:#e6ebf2;
  --text:#152033;
  --muted:#788395;
  --blue:#1769e0;
  --blueDark:#0d3f91;
  --blueSoft:#edf5ff;
  --red:#a25763;
  --redSoft:#fbf4f5;
  --yellow:#987b1d;
  --yellowSoft:#fff9e8;
  --green:#277a5b;
  --greenSoft:#eef8f3;
  --shadow:0 10px 30px rgba(18,35,60,.06);
  --shadow-soft:0 3px 14px rgba(18,35,60,.045);
}
body{
  background:linear-gradient(180deg,#f8fafc 0%,#f4f7fb 100%);
  letter-spacing:-.01em;
}
.panel,.stat,.ordercard,.section,.calendar-shell{
  border-color:var(--line)!important;
  box-shadow:var(--shadow-soft);
}
.panel,.stat,.ordercard,.section{
  backdrop-filter:saturate(120%) blur(2px);
}
.btn{
  border-radius:12px!important;
  padding:10px 14px!important;
  box-shadow:none;
}
.btn.primary{
  box-shadow:0 6px 14px rgba(23,105,224,.16);
}
.input,.select,.textarea{
  border-radius:12px!important;
  background:rgba(255,255,255,.92)!important;
}
.input:focus,.select:focus,.textarea:focus{
  box-shadow:0 0 0 4px rgba(23,105,224,.09)!important;
}
.pagehead h1{
  font-weight:850!important;
  letter-spacing:-.03em;
}
.stat strong,.plate,.modalhead h2{
  letter-spacing:-.03em;
}
.col{
  background:rgba(244,247,251,.82)!important;
  border-color:#e5ebf2!important;
}
.ordercard{
  border-radius:16px!important;
  box-shadow:0 6px 18px rgba(18,35,60,.05)!important;
}
.filters .filter{
  border-radius:999px!important;
  padding:8px 13px!important;
}
.sidebar{
  box-shadow:8px 0 24px rgba(14,55,123,.08);
}
.nav button{
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.nav button:active{transform:scale(.99)}
.modal{
  border:1px solid rgba(224,230,238,.95);
  box-shadow:0 30px 90px rgba(18,35,60,.20)!important;
}
.modalhead{
  backdrop-filter:blur(14px) saturate(130%);
}
.badge{
  border:1px solid rgba(0,0,0,.02);
}


/* Moderner Monatskalender */
.calendar-shell{
  padding:20px!important;
  border-radius:20px!important;

.calendar-top{

/* ==========================================================
   Erle. – Unified Visual System
   Gleiche Designsprache in allen Reitern, Funktionen unverändert
   ========================================================== */
:root{
  --surface:#ffffff;
  --surface-soft:#f7f9fc;
  --surface-subtle:#f2f5f8;
  --hairline:rgba(28,52,83,.075);
  --text-strong:#142033;
  --text-soft:#748199;
  --radius-card:16px;
  --radius-control:11px;
  --shadow-card:0 6px 18px rgba(24,48,78,.045);
}

/* Global rhythm */
.content{
  padding-top:20px!important;
}
.pagehead{
  margin:6px 0 16px!important;
  align-items:center!important;
}
.pagehead h1{
  font-size:29px!important;
  font-weight:780!important;
  letter-spacing:-.04em!important;
}
.pagehead p{
  font-size:13px!important;
  color:var(--text-soft)!important;
}

/* All section surfaces */
.panel,
.section,
.calendar-shell,
.settings-card,
.user-list,
.archive-list{
  background:var(--surface)!important;
  border:1px solid var(--hairline)!important;
  border-radius:var(--radius-card)!important;
  box-shadow:var(--shadow-card)!important;
}

/* Lists: same clean row language everywhere */
.tablewrap,
.orders-simple-list,
.user-list,
.archive-list,
.purchase-list{
  background:transparent!important;
  border-radius:0!important;
  box-shadow:none!important;
}

.tablewrap table{
  width:100%;
}

.tablewrap th,
.user-list-head{
  background:transparent!important;
  color:#8a93a1!important;
  font-size:12px!important;
  font-weight:700!important;
  border-bottom:1px solid var(--hairline)!important;
}

.tablewrap td,
.user-list-row,
.archive-list-row,
.order-simple-row{
  background:transparent!important;
  border-bottom:1px solid var(--hairline)!important;
}

.tablewrap tbody tr:hover,
.user-list-row:not(.user-protected):hover,
.archive-list-row:hover,
.order-simple-row:hover{
  background:rgba(20,115,230,.03)!important;
}

.order-simple-row{
  padding-left:2px!important;
  padding-right:2px!important;
}

/* Cards: overview + purchase */
.ordercard,
.purchase-card{
  background:var(--surface)!important;
  border:1px solid var(--hairline)!important;
  border-radius:var(--radius-card)!important;
  box-shadow:0 3px 12px rgba(24,48,78,.035)!important;
}
.ordercard:hover,
.purchase-card:hover{
  box-shadow:0 8px 18px rgba(24,48,78,.05)!important;
}

/* Buttons / controls */
.btn,
.input,
.select,
.textarea{
  border-radius:var(--radius-control)!important;
}
.text-action{
  font-weight:650!important;
}

/* Customer name alignment on cards */
.cardtop{
  display:flex!important;
  justify-content:space-between!important;
  align-items:flex-start!important;
  gap:14px!important;
}
.cardright{
  margin-left:auto!important;
  min-width:0!important;
  max-width:42%!important;
  display:flex!important;
  flex-direction:column!important;
  align-items:flex-end!important;
  text-align:right!important;
}
.customer-right{
  margin:0!important;
  width:auto!important;
  max-width:100%!important;
  text-align:right!important;
  font-size:11px!important;
  line-height:1.25!important;
  font-weight:500!important;
  color:#8f98a6!important;
  white-space:normal!important;
  overflow-wrap:anywhere!important;
  word-break:normal!important;
}

/* If customer name is sensible length, allow max two lines */
.customer-right{
  display:-webkit-box!important;
  -webkit-box-orient:vertical!important;
  -webkit-line-clamp:2!important;
  overflow:hidden!important;
}

/* Unified sections in details */
.modalbody .section{
  margin-top:14px!important;
}
.sectiontitle{
  font-size:15px!important;
  font-weight:760!important;
  letter-spacing:-.02em!important;
}
.vehicle-id-item{
  background:var(--surface-soft)!important;
  border:1px solid var(--hairline)!important;
  border-radius:12px!important;
}
.calendar-selected{
  background:var(--surface-soft)!important;
  border:1px solid var(--hairline)!important;
}

/* Purchase list rows match orders/list style */
.purchase-list{
  display:flex!important;
  flex-direction:column!important;
  gap:10px!important;
}
.purchase-card{
  padding:15px 16px!important;
}

/* Settings cards same rhythm */
.settings-grid{
  gap:14px!important;
}
.settings-card{
  padding:17px!important;
}

/* Desktop */
@media(min-width:681px){
  .ordercard{
    min-height:0!important;
  }
  .customer-right{
    max-width:180px!important;
  }
}

/* Mobile keeps its intentional differences but same visual system */
@media(max-width:680px){
  .content{
    padding:20px 16px 30px!important;
  }
  .pagehead{
    margin:4px 0 14px!important;
  }
  .pagehead h1{
    font-size:25px!important;
  }
  .panel,
  .section,
  .calendar-shell,
  .settings-card{
    border-radius:15px!important;
    box-shadow:0 5px 14px rgba(24,48,78,.035)!important;
  }
  .ordercard,
  .purchase-card{
    border-radius:14px!important;
    box-shadow:none!important;
  }
  .cardright{
    max-width:44%!important;
  }
  .customer-right{
    max-width:145px!important;
    font-size:11px!important;
  }
  .orders-simple-list,
  .user-list,
  .archive-list{
    border-radius:0!important;
  }
}


/* ==========================================================
   Erle. – Final Unified Product Design
   Desktop + Mobile, functions unchanged
   ========================================================== */

:root{
  --blue:#1473E6;
  --blue-hover:#1267CE;
  --blue-soft:#EEF5FE;

  --bg:#F5F8FC;
  --surface:#FFFFFF;
  --surface-soft:#F8FAFD;
  --surface-muted:#F1F5F9;

  --text:#132033;
  --text-2:#465568;
  --muted:#7A8798;

  --line:#E3EAF2;

  --orange:#C86A1B;
  --orange-soft:#FFF1E8;
  --yellow:#A97700;
  --yellow-soft:#FFF7DB;
  --green:#25865B;
  --green-soft:#EAF8EF;
  --red:#A34F59;
  --red-soft:#FBF3F5;

  --radius:16px;
  --radius-sm:11px;
  --shadow:0 6px 18px rgba(24,48,78,.05);
}

/* ---------- Base ---------- */
html{
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body,
button,
input,
select,
textarea{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI","Helvetica Neue",Arial,sans-serif!important;
}

body{

  color:var(--text)!important;
  font-size:15px!important;
  font-weight:470!important;
  letter-spacing:-.012em;
}

.main{
  background:var(--bg)!important;
}

.content{
  padding:22px 28px 42px!important;
  max-width:none!important;
  width:100%!important;
}

/* ---------- Brand / sidebar ---------- */
.sidebar{
  background:var(--blue)!important;
  box-shadow:10px 0 28px rgba(26,80,145,.08)!important;
}

.brand-sidebar .brand-wordmark,
.mobile-logo-center.brand-wordmark{
  color:#fff!important;
}

.brand-sidebar .brand-wordmark{
  font-size:28px!important;
}

.nav{
  gap:4px!important;
}
.nav button{
  min-height:40px!important;
  border-radius:10px!important;
  padding:10px 12px!important;
  color:rgba(255,255,255,.88)!important;
  font-size:14px!important;
  font-weight:650!important;
}

function normalizePlate(raw){
  let s=String(raw||'').toUpperCase().trim();
  if(!s)return '';

  s=s.replace(/[–—]/g,'-').replace(/\s+/g,' ').replace(/[^A-Z0-9 -]/g,'');

  const explicit=s.split(/[\s-]+/).filter(Boolean);
  if(explicit.length>=3){
    const district=explicit[0];
    const letters=explicit[1];
    const number=explicit.slice(2).join('');
    return [district,letters,number].filter(Boolean).join('-');
  }

  const knownDistricts=['BHV','OHZ','HB','HH','H'];
  const compact=s.replace(/[\s-]/g,'');

  for(const district of knownDistricts){
    if(compact.startsWith(district)){
      const rest=compact.slice(district.length);
      const m=rest.match(/^([A-Z]{1,2})([0-9]{1,4}[A-Z]?)$/);
      if(m)return `${district}-${m[1]}-${m[2]}`;
    }
  }

  const m=compact.match(/^([A-Z]{1,3})([A-Z]{1,2})([0-9]{1,4}[A-Z]?)$/);
  if(m)return `${m[1]}-${m[2]}-${m[3]}`;

  return s.replace(/\s+/g,'-').replace(/-+/g,'-');
}

    if(s?.user && Array.isArray(s.user.identities) && s.user.identities.length===0){
      throw new Error('Dieser Benutzername ist bereits vergeben.');
    }

    session=s;
    localStorage.setItem(SESSION_KEY,JSON.stringify(session));
  }catch(e){
    const msg=String(e?.message||e);
    if(/already|registered|exists|unique|duplicate/i.test(msg))throw new Error('Dieser Benutzername ist bereits vergeben.');

  }
}

const WORKSHOP_CORRECTIONS = [
  [/\boel\b/gi,'Öl'],
  [/\boelservice\b/gi,'Ölservice'],
  [/\böl service\b/gi,'Ölservice'],
  [/\boelwechsel\b/gi,'Ölwechsel'],
  [/\böl wechsel\b/gi,'Ölwechsel'],
  [/\breifen wechsel\b/gi,'Reifenwechsel'],
  [/\bscheiben wischer\b/gi,'Scheibenwischer'],
  [/\bzünd kerzen\b/gi,'Zündkerzen'],
  [/\bluft filter\b/gi,'Luftfilter'],
  [/\böl filter\b/gi,'Ölfilter'],
  [/\bbrems beläge\b/gi,'Bremsbeläge'],
  [/\bbrems scheiben\b/gi,'Bremsscheiben'],
  [/\bkeil riemen\b/gi,'Keilriemen'],
  [/\bzahn riemen\b/gi,'Zahnriemen']
];

function normalizeGermanWorkshopText(value){
  let s=String(value||'').replace(/\s+/g,' ').trim();
  WORKSHOP_CORRECTIONS.forEach(([rx,repl])=>s=s.replace(rx,repl));
  s=s.replace(/(^|[.!?]\s+)([a-zäöü])/g,(m,p,c)=>p+c.toLocaleUpperCase('de-DE'));
  return s;
}

function normalizePlateFlexible(value){
  let raw=String(value||'').trim().toLocaleUpperCase('de-DE');
  if(!raw)return '';
  raw=raw.replace(/[–—]/g,'-').replace(/\s+/g,'-').replace(/-+/g,'-');
  const parts=raw.split('-').filter(Boolean);
  if(parts.length>=3){
    const region=parts[0].replace(/[^A-ZÄÖÜ]/g,'').slice(0,3);
    const letters=parts[1].replace(/[^A-Z]/g,'').slice(0,2);
    const num=parts.slice(2).join('').replace(/[^0-9EH]/g,'').slice(0,5);
    return [region,letters,num].filter(Boolean).join('-');
  }
  return normalizePlate(raw);
}

function syncPublicPlate(){
  const region=($('#crPlateRegion')?.value||'').toLocaleUpperCase('de-DE').replace(/[^A-ZÄÖÜ]/g,'').slice(0,3);
  const letters=($('#crPlateLetters')?.value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,2);
  const number=($('#crPlateNumber')?.value||'').replace(/\D/g,'').slice(0,4);
  const suffix=($('#crPlateSuffix')?.value||'').toUpperCase();

  if($('#crPlateRegion'))$('#crPlateRegion').value=region;
  if($('#crPlateLetters'))$('#crPlateLetters').value=letters;
  if($('#crPlateNumber'))$('#crPlateNumber').value=number;

  const complete=region && letters && number ? `${region}-${letters}-${number}${suffix}` : '';
  if($('#crPlate'))$('#crPlate').value=complete;
  return complete;
}

function timeSlots(){
  const result=[];
  for(let h=9;h<=18;h++){
    for(const m of [0,30]){
      if(h===18 && m>0)continue;
      result.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
    }
  }
  return result;
}

function attachTimeGrid(inputId,buttonId,gridId){
  const input=$('#'+inputId),button=$('#'+buttonId),grid=$('#'+gridId);
  if(!input||!button||!grid)return;

  grid.innerHTML=timeSlots().map(t=>`<button type="button" class="time-slot ${input.value===t?'selected':''}" data-time="${t}">${t}</button>`).join('');

  /* Always start closed. */
  grid.classList.add('hidden');
  button.setAttribute('aria-expanded','false');

  button.onclick=e=>{
    e.preventDefault();
    e.stopPropagation();

    const shouldOpen=grid.classList.contains('hidden');

    document.querySelectorAll('.time-grid').forEach(g=>{
      g.classList.add('hidden');
      const owner=g.parentElement?.querySelector('.time-picker-button');
      if(owner)owner.setAttribute('aria-expanded','false');
    });

    if(shouldOpen){
      grid.classList.remove('hidden');
      button.setAttribute('aria-expanded','true');
    }
  };

  grid.querySelectorAll('[data-time]').forEach(b=>b.onclick=e=>{
    e.preventDefault();
    e.stopPropagation();
    input.value=b.dataset.time;
    button.textContent=b.dataset.time;
    grid.querySelectorAll('.time-slot').forEach(x=>x.classList.toggle('selected',x===b));
    grid.classList.add('hidden');
    button.setAttribute('aria-expanded','false');
  });

  grid.onclick=e=>e.stopPropagation();
}

async function saveCustomerRequestEdits(id,convertAfter=false){
  const r=customerRequests.find(x=>x.id===id);if(!r)return;

  const name=$('#requestName')?.value.trim()||'';
  const phone=$('#requestPhone')?.value.trim()||'';
  const plate=normalizePlateFlexible($('#requestPlate')?.value||'');
  const vehicleText=$('#requestVehicle')?.value.trim()||'';
  const issue=normalizeGermanWorkshopText($('#requestIssue')?.value||'');
  const date=$('#requestDate')?.value||'';
  const time=$('#requestTime')?.value||'';
  const assignee=$('#requestAssignee')?.value||null;

  if(!name||!vehicleText||!issue){
    toast('Name, Fahrzeug und Anliegen müssen ausgefüllt sein.');
    return;
  }
  if(time && !date){
    toast('Bitte zur Uhrzeit auch ein Datum wählen.');
    return;
  }
  if(time && !workshopTimeValid(time)){
    toast('Bitte eine gültige Uhrzeit auswählen.');
    return;
  }
  if(convertAfter && !plate){
    toast('Vor der Übernahme als Auftrag bitte ein Kennzeichen ergänzen.');
    return;
  }

  const desired=date?(date+'T'+(time||'09:00')+':00'):null;
  const patch={
    customer_name:name,
    phone:phone||null,
    license_plate:plate||null,
    vehicle_text:vehicleText,
    issue,
    desired_appointment:desired,
    assigned_user_id:assignee
  };

  try{
    const rows=await rest('erle_customer_requests','?id=eq.'+encodeURIComponent(id),{
      method:'PATCH',
      headers:{Prefer:'return=representation'},
      body:JSON.stringify(patch)
    });
    Object.assign(r,rows?.[0]||patch);
    updateRequestIndicator(false);

    if(convertAfter){
      await convertRequestToOrder(id);
    }else{
      closeModal();
      render();
      toast('Anfrage gespeichert.');
    }
  }catch(e){
    toast('Anfrage konnte nicht gespeichert werden: '+e.message);
  }
}

async function convertRequestToOrder(id){
  const r=customerRequests.find(x=>x.id===id);if(!r||r.status==='converted')return;
  if(!r.license_plate){toast('Vor der Übernahme bitte ein Kennzeichen ergänzen.');return}
  try{
    let v=vehicles.find(x=>(x.license_plate||'').replace(/-/g,'')===(r.license_plate||'').replace(/-/g,''));
    let c=null;
    if(r.customer_name){
      c={id:uid('c'),name:r.customer_name,phone:r.phone||null,email:r.email||null};
      await rest('erle_customers','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(c)});
      customers.push(c);
    }
    if(!v){
      const parts=String(r.vehicle_text||'').trim().split(/\s+/);
      const maker=parts.shift()||'';
      const model=parts.join(' ');
      v={id:uid('v'),customer_id:c?.id||null,license_plate:normalizePlate(r.license_plate),manufacturer:maker,model};
      await rest('erle_vehicles','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(v)});
      vehicles.push(v);
    }else if(c && !v.customer_id){
      v.customer_id=c.id;
      await rest('erle_vehicles','?id=eq.'+encodeURIComponent(v.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:c.id})});
    }

    const work=String(r.issue||'').split(/\n|;|,/).map(x=>x.trim()).filter(Boolean);
    const tasks=work.map((title,i)=>({id:uid('t'),title:capFirst(title),completed:false,position:i+1,part_status:'none'}));
    const o={
      id:uid('o'),
      vehicle_id:v.id,
      customer_id:c?.id||v.customer_id||null,
      order_number:'A-'+Date.now().toString().slice(-6),
      description:r.issue,
      extra_info:'Kundenanfrage',
      priority:'normal',
      appointment_date:r.desired_appointment||null,
      assigned_user_id:r.assigned_user_id||me.id,
      created_by_user_id:me.id,
      payment_status:'open',
      archived_at:null,
      tasks,
      notes:[]
    };
    await rest('erle_orders','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(o)});
    orders.push(o);

    await rest('erle_customer_requests','?id=eq.'+encodeURIComponent(r.id),{
      method:'PATCH',
      headers:{Prefer:'return=minimal'},
      body:JSON.stringify({status:'converted',converted_order_id:o.id,converted_at:new Date().toISOString()})
    });
    r.status='converted';r.converted_order_id=o.id;
    closeModal();
    render();
    toast('Anfrage als Auftrag übernommen.');
  }catch(e){
    toast('Anfrage konnte nicht übernommen werden: '+e.message);
  }
}

function card(o){
  const v=vehicle(o.vehicle_id),c=customer(o.customer_id),tasks=Array.isArray(o.tasks)?o.tasks:[],st=statusOf(o);
  const creator=profiles.find(p=>p.id===o.created_by_user_id);
  const missing=tasks.filter(t=>taskState(t)==='missing').length;
  const available=tasks.filter(t=>['available','installed'].includes(taskState(t))).length;
  const undecided=Math.max(0,tasks.length-missing-available);
  const appointment=o.appointment_date?new Date(o.appointment_date):null;

  let partsSummary='';

    if(available)bits.push(`<span class="parts-bit available">${available} da</span>`);
    if(undecided)bits.push(`<span class="parts-bit neutral">${undecided} offen</span>`);

function dateKey(d){

function selectedDateObj(){

function renderAppointments(){
  const year=calendarCursor.getFullYear(),month=calendarCursor.getMonth();
  const monthName=new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(new Date(year,month,1));
  const first=new Date(year,month,1),last=new Date(year,month+1,0);
  const mondayOffset=(first.getDay()+6)%7;
  const start=new Date(year,month,1-mondayOffset);
  const endOffset=6-((last.getDay()+6)%7);
  const end=new Date(year,month,last.getDate()+endOffset);
  let rows=[],cursor=new Date(start);
  while(cursor<=end){
    const week=[];
    for(let i=0;i<7;i++){week.push(new Date(cursor));cursor.setDate(cursor.getDate()+1)}
    rows.push(week);
  }

  if(!selectedCalendarDate){
    const today=new Date();
    if(today.getFullYear()===year&&today.getMonth()===month) selectedCalendarDate=dateKey(today);
    else selectedCalendarDate=dateKey(new Date(year,month,1));
  }

  const weekDays=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const header=`<div class="calendar-cell calendar-head">KW</div>${weekDays.map((d,i)=>`<div class="calendar-cell calendar-head ${i>=5?'weekend':''}">${d}</div>`).join('')}`;
  const body=rows.map(week=>{
    const kw=isoWeekNumber(week[0]);
    return `<div class="calendar-cell calendar-kw">${kw}</div>`+week.map((d,i)=>{
      const appts=orders.filter(o=>o.appointment_date&&!isArchived(o)&&sameDay(new Date(o.appointment_date),d));
      const key=dateKey(d);
      return `<button type="button" class="calendar-cell calendar-day ${i>=5?'weekend ':''}${d.getMonth()!==month?'outside ':''}${selectedCalendarDate===key?'selected':''}" data-caldate="${key}">
        <span class="daynum">${d.getDate()}</span>${appts.length?'<span class="event-dot"></span>':''}
      </button>`;
    }).join('');
  }).join('');

  const sel=selectedDateObj();
  const selectedAppointments=orders.filter(o=>o.appointment_date&&!isArchived(o)&&sameDay(new Date(o.appointment_date),sel))
    .sort((a,b)=>new Date(a.appointment_date)-new Date(b.appointment_date));
  const selectedLabel=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(sel);

  return `<div class="pagehead"><div><h1>Termine</h1></div></div>
  <div class="calendar-shell">
    <div class="calendar-top">
      <div class="calendar-title">${monthName}</div>
      <div class="calendar-toolbar">
        <button class="btn primary responsive-add calendar-add-btn" id="newAppointmentTop" aria-label="Termin hinzufügen">
          <span class="desktop-add-label">+ Termin hinzufügen</span><span class="mobile-add-label">+</span>
        </button>
        <div class="calendar-nav">
          <button class="btn" id="calPrev">‹</button>
          <button class="btn" id="calToday">Heute</button>
          <button class="btn" id="calNext">›</button>
        </div>
      </div>
    </div>
    <div class="calendar-grid">${header}${body}</div>
    <div class="calendar-legend"><span class="calendar-legend-dot"></span><span>Termin vorhanden</span></div>

    <div class="calendar-selected">
      <div class="calendar-selected-head">
        <div class="calendar-selected-title">${selectedLabel}</div>
      </div>
      <div class="calendar-selected-list">
        ${selectedAppointments.length?selectedAppointments.map(o=>{
          const v=vehicle(o.vehicle_id),d=new Date(o.appointment_date);
          return `<button type="button" class="calendar-event calendar-event-click" data-open="${o.id}">
            <div class="calendar-event-main">
              <strong>${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} · ${esc(v?.license_plate||'')}</strong>
              <span>${esc((v?.manufacturer||'')+' '+(v?.model||''))} · ${esc(o.description||'')}</span>
            </div>
            <span class="calendar-event-arrow">›</span>
          </button>`;
        }).join(''):'<div class="small muted">Keine Termine an diesem Tag.</div>'}
      </div>
    </div>
  </div>`;
}

async function deleteOrderFromList(oid){

  o.archived_at=new Date().toISOString();
  await saveOrder(o);
  render();
  toast('Auftrag ins Archiv verschoben.');
}


async function archiveVehicle(id,showToast=true){
  const v=vehicles.find(x=>x.id===id);if(!v)return;
  v.archived_at=new Date().toISOString();
  await rest('erle_vehicles','?id=eq.'+encodeURIComponent(id),{
    method:'PATCH',
    headers:{Prefer:'return=minimal'},
    body:JSON.stringify({archived_at:v.archived_at})
  });
  closeModal();render();if(showToast)toast('Fahrzeug ins Archiv verschoben.');
}

async function restoreVehicle(id){
  const v=vehicles.find(x=>x.id===id);if(!v)return;
  v.archived_at=null;
  await rest('erle_vehicles','?id=eq.'+encodeURIComponent(id),{
    method:'PATCH',
    headers:{Prefer:'return=minimal'},
    body:JSON.stringify({archived_at:null})
  });
  render();toast('Fahrzeug wiederhergestellt.');
}

async function hardDeleteVehicle(id,showToast=true){
  try{
    const related=orders.filter(o=>o.vehicle_id===id);
    for(const o of related){
      await rest('erle_orders','?id=eq.'+encodeURIComponent(o.id),{method:'DELETE'});
    }
    orders=orders.filter(o=>o.vehicle_id!==id);
    await rest('erle_vehicles','?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
    vehicles=vehicles.filter(v=>v.id!==id);
    render();if(showToast)toast('Fahrzeug endgültig gelöscht.');
  }catch(e){
    toast('Endgültiges Löschen nicht möglich: '+e.message);
  }
}

async function restoreOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  o.archived_at=null;
  await saveOrder(o);
  render();toast('Auftrag wiederhergestellt.');
}

async function hardDeleteOrder(id,showToast=true){
  try{
    await rest('erle_orders','?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
    orders=orders.filter(o=>o.id!==id);
    render();if(showToast)toast('Auftrag endgültig gelöscht.');
  }catch(e){toast('Löschen fehlgeschlagen: '+e.message)}
}


async function updateOwnUsername(){
  const input=$('#settingsUsername');
  const result=$('#usernameResult');
  const next=(input?.value||'').trim();
  if(next.length<3){result.textContent='Mindestens 3 Zeichen.';return}
  if(next.toLowerCase()===(me?.username||'').toLowerCase()){result.textContent='Keine Änderung.';return}
  try{
    const r=await api('/auth/v1/user',{
      method:'PUT',
      body:JSON.stringify({email:technicalEmail(next),data:{username:next}})
    });
    me.username=next;
    const p=profiles.find(x=>x.id===me.id);if(p)p.username=next;
    if(session?.user){session.user=r?.id?r:session.user;localStorage.setItem(SESSION_KEY,JSON.stringify(session))}
    $('#sideUser').textContent=next;
    if($('#mobileUser'))$('#mobileUser').textContent=next;
    result.textContent='Anmeldename Geändert.';
  }catch(e){
    const msg=String(e?.message||e);
    result.textContent=/already|registered|exists|unique|duplicate/i.test(msg)?'Dieser Benutzername ist bereits vergeben.':'Änderung nicht möglich: '+msg;
  }
}
async function updateOwnPassword(){
  const a=$('#settingsPassword')?.value||'';
  const b=$('#settingsPassword2')?.value||'';
  const result=$('#passwordResult');
  if(a.length<8){result.textContent='Mindestens 8 Zeichen.';return}
  if(a!==b){result.textContent='Die Passwörter stimmen nicht überein.';return}
  try{
    await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:a})});
    $('#settingsPassword').value='';$('#settingsPassword2').value='';
    result.textContent='Passwort Geändert.';
  }catch(e){result.textContent='Änderung nicht möglich: '+String(e?.message||e)}
}


async function bulkDeleteArchiveAll(keys){
  for(const key of keys){
    const [type,id]=key.split(':');
    if(type==='o')await hardDeleteOrder(id,false);

  }
  selections.archiveAll.clear();
  editModes.archiveAll=false;
  render();
  toast('Ausgewählte Einträge gelöscht.');
}

    render();

async function deleteUserPermanently(id,name,ask=true){
  if(!isAdmin())return;
  const target=profiles.find(p=>p.id===id);
  if(!target)return;
  if(target.role==='admin'){
    toast('Administratoren sind geschützt und können nicht gelöscht werden.');
    return;
  }
  if(ask){
    const ok=confirm(`Benutzer „${name||target.username||''}“ wirklich endgültig löschen?\n\nDer Login wird vollständig entfernt.`);
    if(!ok)return;
  }
  try{
    await rpc('erle_delete_user',{target_user_id:id});
    profiles=profiles.filter(p=>p.id!==id);
    orders.forEach(o=>{
      if(o.assigned_user_id===id)o.assigned_user_id=null;
      if(o.created_by_user_id===id)o.created_by_user_id=null;
    });
    selections.users.delete(id);
    render();
    if(ask)toast('Benutzer endgültig gelöscht.');
  }catch(e){
    toast('Benutzer konnte nicht gelöscht werden: '+e.message);
  }
}


async function deleteSelectedUsers(){
  const ids=[...selections.users].filter(id=>profiles.find(p=>p.id===id)?.role!=='admin');
  if(!ids.length)return;
  const ok=confirm(`${ids.length} Benutzer wirklich endgültig löschen?\n\nDie Logins werden vollständig entfernt.`);
  if(!ok)return;
  for(const id of ids){
    const p=profiles.find(x=>x.id===id);
    if(p)await deleteUserPermanently(id,p.username,false);
  }
  selections.users.clear();
  editModes.users=false;
  render();
  toast('Ausgewählte Benutzer gelöscht.');
}

function openModal(title,body){$('#modalRoot').innerHTML=`<div class="backdrop"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close">×</button></div><div class="modalbody">${body}</div></div></div>`;$('.close').onclick=closeModal;$('.backdrop').onclick=e=>{if(e.target.classList.contains('backdrop'))closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}

function combo(id,list,getLabel,onChoose,nextId){
  const input=$('#'+id),box=$('#'+id+'Box');if(!input||!box)return;let idx=-1;
  const values=()=>{const q=input.value.toLowerCase().trim();return list().filter(x=>!q||getLabel(x).toLowerCase().includes(q)).slice(0,80)};
  const draw=()=>{const a=values();idx=Math.min(idx,a.length-1);box.innerHTML=a.map((x,i)=>`<button type="button" class="${i===idx?'sel':''}" data-i="${i}">${esc(getLabel(x))}</button>`).join('');box.classList.toggle('hidden',!a.length);box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=a[+b.dataset.i];input.value=getLabel(x);box.classList.add('hidden');onChoose?.(x);if(nextId)$('#'+nextId)?.focus()})};
  input.onfocus=draw;input.oninput=()=>{idx=-1;draw()};input.onkeydown=e=>{const a=values();if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,a.length-1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);draw()}else if(e.key==='Enter'){e.preventDefault();const x=a[Math.max(0,idx)];if(x){input.value=getLabel(x);box.classList.add('hidden');onChoose?.(x)}if(nextId)$('#'+nextId)?.focus()}else if(e.key==='Escape')box.classList.add('hidden')};
  document.addEventListener('pointerdown',function out(e){if(!input.isConnected){document.removeEventListener('pointerdown',out);return}if(!input.closest('.combo').contains(e.target))box.classList.add('hidden')},{capture:true});
}

async function createOrder(){
  try{
    const plate=normalizePlate($('#np').value),maker=$('#nm').value.trim(),model=$('#nmodel').value.trim(),desc=normalizeGermanWorkshopText($('#nd').value);
    if(!plate||!maker||!desc)throw new Error('Kennzeichen, Hersteller und Auftrag sind Pflichtfelder.');

    const year=$('#nyear').value.trim(),hsn=$('#nhsn').value.trim().toUpperCase(),tsn=$('#ntsn').value.trim().toUpperCase();
    if(year && !/^\d{4}$/.test(year))throw new Error('Baujahr bitte vierstellig eingeben.');
    if(hsn && !/^\d{4}$/.test(hsn))throw new Error('HSN muss vierstellig sein.');
    if(tsn && !/^[A-Z0-9]{3}$/.test(tsn))throw new Error('TSN muss dreistellig sein.');

    const assignee=$('#nass').value || me.id;
    let v=vehicles.find(x=>(x.license_plate||'').replace(/-/g,'')===plate.replace(/-/g,''));
    const cname=$('#nc').value.trim();

    if(!v){
      v={id:uid('v'),customer_id:null,license_plate:plate,manufacturer:maker,model,year:year||null,hsn:hsn||null,tsn:tsn||null};
      await rest('erle_vehicles','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(v)});
      vehicles.push(v);
    }else{
      const patch={manufacturer:maker,model,year:year||v.year||null,hsn:hsn||v.hsn||null,tsn:tsn||v.tsn||null};
      Object.assign(v,patch);
      await rest('erle_vehicles','?id=eq.'+encodeURIComponent(v.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(patch)});
    }

    const work=desc.split(/\n|;|,/).map(x=>x.trim()).filter(Boolean);
    const tasks=work.map((title,i)=>({id:uid('t'),title:capFirst(title),completed:false,position:i+1,part_status:'none'}));
    const orderTime=$('#ntime').value||'09:00';
    if($('#ndate').value && !workshopTimeValid(orderTime))throw new Error('Termine sind nur zwischen 09:00 und 18:00 Uhr möglich.');
    const dt=$('#ndate').value?$('#ndate').value+'T'+orderTime+':00':null;

    const o={
      id:uid('o'),vehicle_id:v.id,customer_id:null,order_number:'A-'+Date.now().toString().slice(-6),
      description:desc,extra_info:$('#ne').value.trim(),priority:'normal',appointment_date:dt,
      assigned_user_id:assignee,created_by_user_id:me.id,payment_status:'open',archived_at:null,tasks,notes:[]
    };

    await rest('erle_orders','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(o)});
    orders.push(o);

    if(cname){
      const cust={id:uid('c'),name:cname};
      await rest('erle_customers','',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(cust)});
      customers.push(cust);
      o.customer_id=cust.id;v.customer_id=cust.id;
      await rest('erle_orders','?id=eq.'+encodeURIComponent(o.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:cust.id})});
      await rest('erle_vehicles','?id=eq.'+encodeURIComponent(v.id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({customer_id:cust.id})});
    }

    closeModal();render();toast('Auftrag erstellt.');
  }catch(e){toast('Auftrag konnte nicht erstellt werden: '+e.message)}
}

async function saveOrderWindow(oid){
  const o=orders.find(x=>x.id===oid);if(!o)return;
  o.description=$('#editDescription')?.value.trim()||o.description;
  o.extra_info=$('#editExtra')?.value.trim()||'';
  const editAppointmentValue=$('#editAppointment')?.value||'';
  const editAppointmentTime=appointmentTimeFromDateTime(editAppointmentValue);
  if(editAppointmentTime && !workshopTimeValid(editAppointmentTime)){
    toast('Termine sind nur zwischen 09:00 und 18:00 Uhr möglich.');
    return;
  }
  o.appointment_date=editAppointmentValue?editAppointmentValue+':00':null;
  if(isAdmin()&&$('#editAssignee'))o.assigned_user_id=$('#editAssignee').value;
  const note=$('#noteText')?.value.trim();
  if(note){
    o.notes=o.notes||[];
    o.notes.push({id:uid('n'),text:note,created_at:new Date().toISOString()});
  }
  await saveOrder(o);
  render();
  closeModal();
  toast('Auftrag gespeichert.');
}

async function saveOrder(o){try{const rr=await rest('erle_orders','?id=eq.'+encodeURIComponent(o.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({tasks:o.tasks,notes:o.notes,description:o.description,extra_info:o.extra_info,appointment_date:o.appointment_date,completed_at:o.completed_at,assigned_user_id:o.assigned_user_id,payment_status:o.payment_status||'open',archived_at:o.archived_at||null})});if(rr?.[0])Object.assign(o,rr[0])}catch(e){toast('Speichern fehlgeschlagen: '+e.message);await loadData(true)}}

        <div class="field"><label>Zusatzinformation</label><textarea id="editExtra" class="textarea" rows="3">${esc(o.extra_info||'')}</textarea></div>
      </div>
      <div class="grid2" style="margin-top:14px">
        <div class="field"><label>Termin</label><input id="editAppointment" type="datetime-local" step="900" class="input" value="${o.appointment_date?String(o.appointment_date).slice(0,16):''}"></div>

      <div class="addrow"><input id="newTask" class="input" placeholder="Neue Arbeit hinzufügen…"><button id="addTaskBtn" class="btn">Hinzufügen</button></div>

    <div class="section"><div class="sectiontitle">Notizen</div>
      <div>${(o.notes||[]).map(n=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${esc(n.text)}<div class="small muted">${new Date(n.created_at).toLocaleString('de-DE')}</div></div>`).join('')||'<div class="small muted">Keine Notizen.</div>'}</div>
      <div class="addrow"><input id="noteText" class="input" placeholder="Notiz hinzufügen…"></div>
    </div>

    <div class="actions">
      ${o.archived_at?`<button id="restoreOrderBtn" class="text-action">Wiederherstellen</button><button id="hardDeleteOrderBtn" class="text-action delete-text">Löschen</button>`:`<button id="archiveBtn" class="text-action delete-text">Löschen</button>`}
      <button id="saveOrderBtn" class="btn primary">Auftrag Speichern</button>
    </div>
  `);

  document.querySelectorAll('[data-part]').forEach(x=>x.onclick=()=>setPart(o.id,x.dataset.task,x.dataset.part));
  $('#addTaskBtn').onclick=()=>addTask(o.id);
  $('#newTask').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTask(o.id)}};

  if($('#archiveBtn'))$('#archiveBtn').onclick=()=>toggleArchive(o.id);

}
function taskRow(o,t){
  const s=taskState(t);
  return `<div class="task" style="grid-template-columns:minmax(0,1fr) auto"><div class="tasktitle">${esc(capFirst(t.title))}</div><div class="partstates"><button class="partbtn ${s==='missing'?'missing':''}" data-part="missing" data-task="${t.id}">${s==='missing'?'✓ ':''}Fehlt</button><button class="partbtn ${s==='available'?'available':''}" data-part="available" data-task="${t.id}">${s==='available'?'✓ ':''}Da</button><button class="partbtn ${s==='installed'?'installed':''}" data-part="installed" data-task="${t.id}">${s==='installed'?'✓ ':''}Verbaut</button></div></div>`;
}
async function toggleTask(oid,tid,val){
  const o=orders.find(x=>x.id===oid),t=(o.tasks||[]).find(x=>x.id===tid);
  if(!t)return;
  t.completed=val;
  if(val&&t.part_status==='available')t.part_status='installed';

  const tasks=Array.isArray(o.tasks)?o.tasks:[];
  if(tasks.length&&tasks.every(x=>x.completed))o.completed_at=o.completed_at||new Date().toISOString();
  else o.completed_at=null;

  await saveOrder(o);
  render();
  openOrder(oid);
}

function refreshOrderViewPreservePosition(oid){
  const pageY=window.scrollY||document.documentElement.scrollTop||0;
  const modalBody=document.querySelector('.modalbody');
  const modalY=modalBody?modalBody.scrollTop:0;

  render();
  openOrder(oid);

  requestAnimationFrame(()=>{
    window.scrollTo(0,pageY);
    const nextBody=document.querySelector('.modalbody');
    if(nextBody)nextBody.scrollTop=modalY;
  });
}

async function setPart(oid,tid,state){
  const o=orders.find(x=>x.id===oid),t=(o.tasks||[]).find(x=>x.id===tid);
  if(!t)return;

  const was=t.part_status||'none';
  t.part_status=was===state?'none':state;

  if(t.part_status==='installed'){
    t.completed=true;
  }else if(was==='installed'){
    t.completed=false;
  }

  const tasks=Array.isArray(o.tasks)?o.tasks:[];
  if(tasks.length && tasks.every(x=>x.completed)){
    o.completed_at=o.completed_at||new Date().toISOString();
  }else{
    o.completed_at=null;
  }

  await saveOrder(o);
  refreshOrderViewPreservePosition(oid);
}
async function addTask(oid){
  const o=orders.find(x=>x.id===oid),title=$('#newTask').value.trim();
  if(!title)return;
  o.tasks=o.tasks||[];
  o.tasks.push({id:uid('t'),title:capFirst(title),completed:false,position:o.tasks.length+1,part_status:'none'});
  await saveOrder(o);
  refreshOrderViewPreservePosition(oid);
}
async function addNote(oid){const o=orders.find(x=>x.id===oid),text=$('#noteText').value.trim();if(!text)return;o.notes=o.notes||[];o.notes.push({id:uid('n'),text,created_at:new Date().toISOString()});await saveOrder(o);openOrder(oid)}
async function markFinished(oid,val){
  const o=orders.find(x=>x.id===oid);
  if(!o)return;
  o.completed_at=val?new Date().toISOString():null;
  await saveOrder(o);
  refreshOrderViewPreservePosition(oid);
}
async function setPayment(oid,status){
  const o=orders.find(x=>x.id===oid);
  if(!o)return;
  o.payment_status=status;
  await saveOrder(o);
  refreshOrderViewPreservePosition(oid);
}
async function toggleArchive(oid){
  const o=orders.find(x=>x.id===oid);if(!o)return;
  o.archived_at=o.archived_at?null:new Date().toISOString();
  await saveOrder(o);
  closeModal();
  render();
  toast(o.archived_at?'Auftrag ins Archiv verschoben.':'Auftrag wiederhergestellt.');
}

  try{

      if(p!==c)throw new Error('Die Passwörter stimmen nicht überein.');
      await register(u,p);
    }else{
      await signIn(u,p);
    }
    await enterApp();
  }catch(e){
    $('#authMessage').textContent=e.message;
    $('#authMessage').classList.remove('hidden');
  }
};

if($('#mobileLogoutBtn'))$('#mobileLogoutBtn').onclick=logout;
if($('#topNew'))$('#topNew').onclick=openNewOrder;

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  if(b.classList.contains('hidden'))return;
  page=b.dataset.page;
  render();
});
if(!session?.access_token)showPublic();
enterApp();
</script>

  const POPULAR_MAKES=["Volkswagen","Mercedes-Benz","BMW","Audi","Škoda","Opel","Ford","Toyota"];
  const maker=$('#crManufacturer'),model=$('#crModel'),variant=$('#crVariant');
  const makerBox=$('#crManufacturerSuggest'),modelBox=$('#crModelSuggest'),variantBox=$('#crVariantSuggest');
  if(!maker||!model||!variant||!makerBox||!modelBox||!variantBox)return;

  function exactMake(){
    const q=maker.value.trim().toLowerCase();
    return Object.keys(DB).find(x=>x.toLowerCase()===q)||'';
  }
  function exactModel(make){
    if(!make)return '';
    const q=model.value.trim().toLowerCase();
    return DB[make].models.find(x=>x.toLowerCase()===q)||'';
  }
  function show(box,items,onPick){
    if(!items.length){box.classList.add('hidden');box.innerHTML='';return}
    box.innerHTML=items.slice(0,10).map(v=>`<button type="button" data-value="${esc(v)}">${esc(v)}</button>`).join('');
    box.classList.remove('hidden');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{onPick(b.dataset.value);box.classList.add('hidden')});
  }

  maker.onfocus=()=>{
    const q=maker.value.trim().toLowerCase();
    const items=q?Object.keys(DB).filter(x=>x.toLowerCase().includes(q)):POPULAR_MAKES;
    show(makerBox,items,v=>{maker.value=v;model.value='';variant.value='';maker.dispatchEvent(new Event('change'))});
  };
  maker.oninput=()=>{
    const q=maker.value.trim().toLowerCase();
    show(makerBox,Object.keys(DB).filter(x=>x.toLowerCase().includes(q)),v=>{maker.value=v;model.value='';variant.value='';maker.dispatchEvent(new Event('change'))});
  };
  maker.onchange=()=>{model.value='';variant.value='';modelBox.classList.add('hidden');variantBox.classList.add('hidden')};

  model.onfocus=()=>{
    const make=exactMake(); if(!make)return;
    const q=model.value.trim().toLowerCase();
    const items=q?DB[make].models.filter(x=>x.toLowerCase().includes(q)):DB[make].popular;
    show(modelBox,items,v=>{model.value=v;variant.value='';model.dispatchEvent(new Event('change'))});
  };
  model.oninput=()=>{
    const make=exactMake(); if(!make)return;
    const q=model.value.trim().toLowerCase();
    show(modelBox,DB[make].models.filter(x=>x.toLowerCase().includes(q)),v=>{model.value=v;variant.value='';model.dispatchEvent(new Event('change'))});
  };
  model.onchange=()=>{variant.value='';variantBox.classList.add('hidden')};

  variant.onfocus=()=>{
    const make=exactMake(),mdl=exactModel(make); if(!make||!mdl)return;
    show(variantBox,DB[make].variants[mdl]||[],v=>{variant.value=v});
  };
  variant.oninput=()=>{
    const make=exactMake(),mdl=exactModel(make); if(!make||!mdl)return;
    const q=variant.value.trim().toLowerCase();
    show(variantBox,(DB[make].variants[mdl]||[]).filter(x=>x.toLowerCase().includes(q)),v=>{variant.value=v});
  };

  const logical=[maker,model,variant,$('#crPlateRegion'),$('#crPlateLetters'),$('#crPlateNumber'),$('#crIssue'),$('#crDate'),$('#crTimeButton'),$('#crName'),$('#crPhone')].filter(Boolean);
  logical.forEach((el,i)=>el.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||el.tagName==='TEXTAREA')return;
    e.preventDefault();
    if(logical[i+1])logical[i+1].focus();
  }));

  document.addEventListener('click',e=>{
    if(!e.target.closest('.public-autocomplete-field')){
      makerBox.classList.add('hidden');modelBox.classList.add('hidden');variantBox.classList.add('hidden');
    }
  });
})();
</script>




<script id="erle-public-form-enhancers">
(function(){
  ['crPlateRegion','crPlateLetters','crPlateNumber','crPlateSuffix'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener('input',syncPublicPlate);
    if(el)el.addEventListener('change',syncPublicPlate);
  });

  const region=$('#crPlateRegion'),letters=$('#crPlateLetters'),number=$('#crPlateNumber');
  if(region)region.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();region.value=region.value.toUpperCase();letters?.focus()}};
  if(letters)letters.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();letters.value=letters.value.toUpperCase();number?.focus()}};

  attachTimeGrid('crTime','crTimeButton','crTimeGrid');

  const issue=$('#crIssue');
  if(issue)issue.addEventListener('blur',()=>issue.value=normalizeGermanWorkshopText(issue.value));
})();
</script>


<script id="erle-timegrid-outside-close">
document.addEventListener('click',function(e){
  if(e.target.closest('.time-picker-field')) return;
  document.querySelectorAll('.time-grid').forEach(g=>g.classList.add('hidden'));
  document.querySelectorAll('.time-picker-button').forEach(b=>b.setAttribute('aria-expanded','false'));
});
</script>
