function normalizePlate(raw){
  let s=String(raw||'').toUpperCase().trim();
  if(!s)return '';

  s=s.replace(/[–—]/g,'-').replace(/\s+/g,' ').replace(/[^A-Z0-9 -]/g,'');

  const explicit=s.split(/[\s-]+/).filter(Boolean);
  if(explicit.length>=3){
    const district=explicit[0];
    const letters=explicit[1];
    const number=explicit.slice(2).join('');
    return [district,letters,number].filter(Boolean).join('-');
  }

  const knownDistricts=['BHV','OHZ','HB','HH','H'];
  const compact=s.replace(/[\s-]/g,'');

  for(const district of knownDistricts){
    if(compact.startsWith(district)){
      const rest=compact.slice(district.length);
      const m=rest.match(/^([A-Z]{1,2})([0-9]{1,4}[A-Z]?)$/);
      if(m)return `${district}-${m[1]}-${m[2]}`;
    }
  }

  const m=compact.match(/^([A-Z]{1,3})([A-Z]{1,2})([0-9]{1,4}[A-Z]?)$/);
  if(m)return `${m[1]}-${m[2]}-${m[3]}`;

  return s.replace(/\s+/g,'-').replace(/-+/g,'-');
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=p=>p+'-'+crypto.randomUUID();
const technicalEmail=username=>{
  const bytes=new TextEncoder().encode(username.trim().toLowerCase());
  let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return 'u_'+btoa(bin).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_')+'@erle.local';
};

function headers(extra={}){const h={apikey:SUPABASE_KEY,'Content-Type':'application/json',...extra};if(session?.access_token)h.Authorization='Bearer '+session.access_token;return h}
async function api(path,opts={}){const r=await fetch(SUPABASE_URL+path,{...opts,headers:headers(opts.headers||{})});let body=null;const txt=await r.text();if(txt){try{body=JSON.parse(txt)}catch{body=txt}}if(!r.ok)throw new Error((body&&body.message)||body?.error_description||body?.hint||('Fehler '+r.status));return body}
async function rest(table,query='',opts={}){return api('/rest/v1/'+table+query,opts)}

async function signIn(username,password){
  const email=technicalEmail(username);
  try{
    const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
    session=s;localStorage.setItem(SESSION_KEY,JSON.stringify(session));return true;
  }catch(e){
    if(username.toLowerCase()==='admin' && password==='12345678'){
      const s=await signUpRaw('Admin',password);
      if(s?.access_token){session=s;localStorage.setItem(SESSION_KEY,JSON.stringify(session));return true}
    }
    throw e;
  }
}
async function signUpRaw(username,password){
  return api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:technicalEmail(username),password,data:{username}})})
}
async function register(username,password){
  if(username.toLowerCase()==='admin')throw new Error('Der Benutzername Admin ist reserviert.');
  const s=await signUpRaw(username,password);
  if(!s?.access_token)throw new Error('Registrierung angelegt, aber keine Sitzung erhalten. In Supabase muss „Confirm email“ ausgeschaltet sein.');
  session=s;localStorage.setItem(SESSION_KEY,JSON.stringify(session));
}
async function refreshSession(){

    session=s;localStorage.setItem(SESSION_KEY,JSON.stringify(session));return true;
  }catch{return false}
}

function isArchived(o){return !!o.archived_at}
function archiveExpired(o){
  if(!o.archived_at)return false;
  return (Date.now()-new Date(o.archived_at).getTime()) > 42*24*60*60*1000;
}
async function purgeExpiredArchive(){

    try{
      await rest('erle_orders','?id=eq.'+encodeURIComponent(o.id),{method:'DELETE'});

function vehicle(id){return vehicles.find(v=>v.id===id)} function customer(id){return customers.find(c=>c.id===id)}
function taskState(t){return t.part_status||'none'}
function statusOf(o){
  if(o.completed_at)return 'done';
  const tasks=Array.isArray(o.tasks)?o.tasks:[];
  if(tasks.some(t=>taskState(t)==='missing'))return 'buy';
  if(tasks.some(t=>t.completed||['available','installed'].includes(taskState(t))))return 'working';
  return 'planned';
}
const statLabel={planned:'Auftrag',buy:'Einkauf erforderlich',working:'In Arbeit',done:'Fertig'};

  let a=orders.filter(o=>!isArchived(o));

  return a;
}

function wire(){
  document.querySelectorAll('[data-action="new"]').forEach(b=>b.onclick=openNewOrder);
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openOrder(b.dataset.open));
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
  document.querySelectorAll('.ordercard').forEach(cardEl=>{cardEl.onclick=()=>openOrder(cardEl.dataset.order);cardEl.ondragstart=()=>cardEl.classList.add('dragging');cardEl.ondragend=()=>cardEl.classList.remove('dragging')});
  document.querySelectorAll('[data-drop]').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');col.ondrop=async e=>{e.preventDefault();col.classList.remove('over');const el=document.querySelector('.ordercard.dragging');if(!el)return;const o=orders.find(x=>x.id===el.dataset.order);if(!o)return;const st=col.dataset.drop;if(st==='done'){await markFinished(o.id,true);return}if(st==='buy'){const t=(o.tasks||[])[0];if(t)t.part_status='missing'}if(st==='working'){(o.tasks||[]).forEach(t=>{if(t.part_status==='missing')t.part_status='available'})}if(st==='planned'){(o.tasks||[]).forEach(t=>{if(!t.completed)t.part_status='none'})}await saveOrder(o);render()}});
  if($('#testConnection'))$('#testConnection').onclick=async()=>{try{await rest('erle_profiles','?select=id&limit=1');$('#connResult').innerHTML='<span class="badge green">Verbunden</span>'}catch(e){$('#connResult').innerHTML='<div class="error">'+esc(e.message)+'</div>'}};
  if($('#reloadUsers')) $('#reloadUsers').onclick=loadUsersNow;
  document.querySelectorAll('[data-user-role]').forEach(b=>b.onclick=()=>updateUserProfile(b.dataset.userRole,{role:b.dataset.role}));
  document.querySelectorAll('[data-user-active]').forEach(b=>b.onclick=()=>updateUserProfile(b.dataset.userActive,{active:b.dataset.active==='true'}));
}

function openModal(title,body){$('#modalRoot').innerHTML=`<div class="backdrop"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close">×</button></div><div class="modalbody">${body}</div></div></div>`;$('.close').onclick=closeModal;$('.backdrop').onclick=e=>{if(e.target.classList.contains('backdrop'))closeModal()}}

function combo(id,list,getLabel,onChoose,nextId){
  const input=$('#'+id),box=$('#'+id+'Box');if(!input||!box)return;let idx=-1;
  const values=()=>{const q=input.value.toLowerCase().trim();return list().filter(x=>!q||getLabel(x).toLowerCase().includes(q)).slice(0,80)};
  const draw=()=>{const a=values();idx=Math.min(idx,a.length-1);box.innerHTML=a.map((x,i)=>`<button type="button" class="${i===idx?'sel':''}" data-i="${i}">${esc(getLabel(x))}</button>`).join('');box.classList.toggle('hidden',!a.length);box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=a[+b.dataset.i];input.value=getLabel(x);box.classList.add('hidden');onChoose?.(x);if(nextId)$('#'+nextId)?.focus()})};
  input.onfocus=draw;input.oninput=()=>{idx=-1;draw()};input.onkeydown=e=>{const a=values();if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,a.length-1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);draw()}else if(e.key==='Enter'){e.preventDefault();const x=a[Math.max(0,idx)];if(x){input.value=getLabel(x);box.classList.add('hidden');onChoose?.(x)}if(nextId)$('#'+nextId)?.focus()}else if(e.key==='Escape')box.classList.add('hidden')};
  document.addEventListener('pointerdown',function out(e){if(!input.isConnected){document.removeEventListener('pointerdown',out);return}if(!input.closest('.combo').contains(e.target))box.classList.add('hidden')},{capture:true});
}
function openNewOrder(){
  const workerOptions=isAdmin()?profiles.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.username)}</option>`).join(''):`<option value="${me.id}">${esc(me.username)}</option>`;
  openModal('Neuer Auftrag',`<div class="grid2"><div class="field"><label>Kennzeichen *</label><input id="np" class="input" placeholder="z. B. HB-AB-123"></div><div class="field"><label>Hersteller *</label><div class="combo"><input id="nm" class="input" autocomplete="off" placeholder="Hersteller suchen…"><div id="nmBox" class="suggestions hidden"></div></div></div></div>

  $('#saveNew').onclick=createOrder;
}
async function createOrder(){
  try{
    const plate=normalizePlate($('#np').value),maker=$('#nm').value.trim(),model=$('#nmodel').value.trim(),desc=$('#nd').value.trim();
    if(!plate||!maker||!desc)throw new Error('Kennzeichen, Hersteller und Auftrag sind Pflichtfelder.');

    const assignee=$('#nass').value || me.id;
    let v=vehicles.find(x=>(x.license_plate||'').replace(/-/g,'')===plate.replace(/-/g,''));
    const cname=$('#nc').value.trim();

    if(!v){
      v={id:uid('v'),customer_id:null,license_plate:plate,manufacturer:maker,model};
      await rest('erle_vehicles','',{
        method:'POST',
        headers:{Prefer:'return=minimal'},
        body:JSON.stringify(v)
      });
      vehicles.push(v);
    }

    const work=desc.split(/\n|;|,/).map(x=>x.trim()).filter(Boolean);
    const tasks=work.map((title,i)=>({id:uid('t'),title,completed:false,position:i+1,part_status:'none'}));
    const dt=$('#ndate').value?$('#ndate').value+'T'+($('#ntime').value||'08:00')+':00':null;

    const o={
      id:uid('o'),
      vehicle_id:v.id,
      customer_id:null,
      order_number:'A-'+Date.now().toString().slice(-6),
      description:desc,
      extra_info:$('#ne').value.trim(),
      priority:'normal',
      appointment_date:dt,
      assigned_user_id:assignee,
      payment_status:'open',
      archived_at:null,
      tasks,
      notes:[]
    };

    await rest('erle_orders','',{
      method:'POST',
      headers:{Prefer:'return=minimal'},
      body:JSON.stringify(o)
    });
    orders.push(o);

    if(cname){
      const cust={id:uid('c'),name:cname};
      await rest('erle_customers','',{
        method:'POST',
        headers:{Prefer:'return=minimal'},
        body:JSON.stringify(cust)
      });
      customers.push(cust);

      o.customer_id=cust.id;
      v.customer_id=cust.id;

      await rest('erle_orders','?id=eq.'+encodeURIComponent(o.id),{
        method:'PATCH',
        headers:{Prefer:'return=minimal'},
        body:JSON.stringify({customer_id:cust.id})
      });
      await rest('erle_vehicles','?id=eq.'+encodeURIComponent(v.id),{
        method:'PATCH',
        headers:{Prefer:'return=minimal'},
        body:JSON.stringify({customer_id:cust.id})
      });
    }

    closeModal();
    render();
    openOrder(o.id);
  }catch(e){
    toast('Auftrag konnte nicht erstellt werden: '+e.message);
  }
}
async function saveOrder(o){try{const rr=await rest('erle_orders','?id=eq.'+encodeURIComponent(o.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({tasks:o.tasks,notes:o.notes,description:o.description,extra_info:o.extra_info,appointment_date:o.appointment_date,completed_at:o.completed_at,assigned_user_id:o.assigned_user_id,payment_status:o.payment_status||'open',archived_at:o.archived_at||null})});if(rr?.[0])Object.assign(o,rr[0])}catch(e){toast('Speichern fehlgeschlagen: '+e.message);await loadData(true)}}
function openOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;const v=vehicle(o.vehicle_id),tasks=Array.isArray(o.tasks)?o.tasks:[],st=statusOf(o);
  openModal(esc(v?.license_plate||''),`<div class="muted">${esc((v?.manufacturer||'')+' '+(v?.model||''))}</div>
  <div class="section"><div class="grid2"><div><div class="small muted">Auftrag</div><strong>${esc(o.description)}</strong></div><div><div class="small muted">Status</div><strong>${statLabel[st]}</strong></div></div></div>
  <div class="section"><div class="between"><div class="sectiontitle">Arbeiten <span class="small muted">${tasks.filter(t=>t.completed).length}/${tasks.length} erledigt</span></div><span class="small muted">Teilestatus direkt je Arbeit</span></div>
  <div id="taskList">${tasks.map(t=>taskRow(o,t)).join('')}</div>
  <div class="addrow"><input id="newTask" class="input" placeholder="Neue Arbeit hinzufügen…"><button id="addTaskBtn" class="btn">Hinzufügen</button></div></div>
  <div class="section"><div class="sectiontitle">Fahrzeugstatus</div><label class="row"><input id="finishCar" type="checkbox" ${o.completed_at?'checked':''} style="width:19px;height:19px"><strong>Fahrzeug fertig</strong></label></div>
  <div class="section"><div class="between"><div><div class="sectiontitle" style="margin-bottom:4px">Zahlung</div><div class="small muted">Zahlungsstatus des Auftrags</div></div><div class="row"><button id="payOpen" class="btn ${o.payment_status==='paid'?'':'danger'}">Offen</button><button id="payPaid" class="btn ${o.payment_status==='paid'?'primary':''}" style="${o.payment_status==='paid'?'background:var(--green);border-color:var(--green);':''}">Bezahlt</button></div></div></div>
  ${o.completed_at?`<div class="section"><div class="between"><div><div class="sectiontitle" style="margin-bottom:4px">${o.archived_at?'Archiv':'Fertiger Auftrag'}</div><div class="small muted">${o.archived_at?'Der Auftrag bleibt insgesamt 6 Wochen im Archiv.':'Löschen entfernt den Auftrag aus der aktiven Übersicht und verschiebt ihn ins Archiv.'}</div></div><button id="archiveBtn" class="btn ${o.archived_at?'':'danger'}">${o.archived_at?'Wiederherstellen':'Löschen'}</button></div></div>`:''}
  <div class="section"><div class="sectiontitle">Notizen</div><div>${(o.notes||[]).map(n=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${esc(n.text)}<div class="small muted">${new Date(n.created_at).toLocaleString('de-DE')}</div></div>`).join('')||'<div class="small muted">Keine Notizen.</div>'}</div><div class="addrow"><input id="noteText" class="input" placeholder="Notiz hinzufügen…"><button id="addNoteBtn" class="btn">Speichern</button></div></div>`);
  document.querySelectorAll('[data-taskcheck]').forEach(x=>x.onchange=()=>toggleTask(o.id,x.dataset.taskcheck,x.checked));
  document.querySelectorAll('[data-part]').forEach(x=>x.onclick=()=>setPart(o.id,x.dataset.task,x.dataset.part));
  $('#addTaskBtn').onclick=()=>addTask(o.id);$('#newTask').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTask(o.id)}};
  $('#finishCar').onchange=()=>markFinished(o.id,$('#finishCar').checked);
  if($('#payOpen')) $('#payOpen').onclick=()=>setPayment(o.id,'open');
  if($('#payPaid')) $('#payPaid').onclick=()=>setPayment(o.id,'paid');
  if($('#archiveBtn')) $('#archiveBtn').onclick=()=>toggleArchive(o.id);
  $('#addNoteBtn').onclick=()=>addNote(o.id);$('#noteText').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addNote(o.id)}};
}
function taskRow(o,t){
  const s=taskState(t);return `<div class="task ${t.completed?'done':''}"><input type="checkbox" data-taskcheck="${t.id}" ${t.completed?'checked':''}><div class="tasktitle">${esc(t.title)}</div><div class="partstates"><button class="partbtn ${s==='missing'?'missing':''}" data-part="missing" data-task="${t.id}">${s==='missing'?'✓ ':''}Fehlt</button><button class="partbtn ${s==='available'?'available':''}" data-part="available" data-task="${t.id}">${s==='available'?'✓ ':''}Da</button><button class="partbtn ${s==='installed'?'installed':''}" data-part="installed" data-task="${t.id}">${s==='installed'?'✓ ':''}Verbaut</button></div></div>`;
}
async function toggleTask(oid,tid,val){
  const o=orders.find(x=>x.id===oid),t=(o.tasks||[]).find(x=>x.id===tid);
  if(!t)return;
  t.completed=val;
  if(val&&t.part_status==='available')t.part_status='installed';

  const tasks=Array.isArray(o.tasks)?o.tasks:[];
  if(tasks.length&&tasks.every(x=>x.completed))o.completed_at=o.completed_at||new Date().toISOString();
  else o.completed_at=null;

  await saveOrder(o);
  render();
  openOrder(oid);
}
async function setPart(oid,tid,state){
  const o=orders.find(x=>x.id===oid),t=(o.tasks||[]).find(x=>x.id===tid);
  if(!t)return;

  const was=t.part_status||'none';
  t.part_status=was===state?'none':state;

  if(t.part_status==='installed'){
    t.completed=true;
  }else if(was==='installed'){
    t.completed=false;
  }

  const tasks=Array.isArray(o.tasks)?o.tasks:[];
  if(tasks.length && tasks.every(x=>x.completed)){
    o.completed_at=o.completed_at||new Date().toISOString();
  }else{
    o.completed_at=null;
  }

  await saveOrder(o);
  render();
  openOrder(oid);
}
async function addTask(oid){const o=orders.find(x=>x.id===oid),title=$('#newTask').value.trim();if(!title)return;o.tasks=o.tasks||[];o.tasks.push({id:uid('t'),title,completed:false,position:o.tasks.length+1,part_status:'none'});await saveOrder(o);openOrder(oid);render()}
async function addNote(oid){const o=orders.find(x=>x.id===oid),text=$('#noteText').value.trim();if(!text)return;o.notes=o.notes||[];o.notes.push({id:uid('n'),text,created_at:new Date().toISOString()});await saveOrder(o);openOrder(oid)}
async function markFinished(oid,val){const o=orders.find(x=>x.id===oid);o.completed_at=val?new Date().toISOString():null;render();await saveOrder(o);openOrder(oid)}
async function setPayment(oid,status){
  const o=orders.find(x=>x.id===oid);if(!o)return;
  o.payment_status=status;
  await saveOrder(o);
  render();
  openOrder(oid);
}
async function toggleArchive(oid){
  const o=orders.find(x=>x.id===oid);if(!o||!o.completed_at)return;
  o.archived_at=o.archived_at?null:new Date().toISOString();
  await saveOrder(o);
  closeModal();
  render();
  toast(o.archived_at?'Auftrag ins Archiv verschoben.':'Auftrag wiederhergestellt.');
}

$('#authSwitchBtn').onclick=()=>{authMode=authMode==='login'?'signup':'login';const s=authMode==='signup';$('#confirmWrap').classList.toggle('hidden',!s);$('#authMainBtn').textContent=s?'Account erstellen':'Anmelden';$('#authSwitchText').textContent=s?'Bereits ein Konto?':'Noch kein Konto?';$('#authSwitchBtn').textContent=s?'Anmelden':'Account erstellen';$('#authMessage').classList.add('hidden')};
$('#authMainBtn').onclick=async()=>{const u=$('#loginUser').value.trim(),p=$('#loginPass').value;try{if(u.length<3||p.length<8)throw new Error('Benutzername mindestens 3 Zeichen, Passwort mindestens 8 Zeichen.');if(authMode==='signup'){if(p!==$('#loginConfirm').value)throw new Error('Passwörter stimmen nicht überein.');await register(u,p)}else await signIn(u,p);await enterApp()}catch(e){$('#authMessage').textContent=e.message;$('#authMessage').classList.remove('hidden')}};
$('#loginPass').onkeydown=e=>{if(e.key==='Enter')$('#authMainBtn').click()};
$('#logoutBtn').onclick=logout;$('#topNew').onclick=openNewOrder;$('#search').oninput=e=>{search=e.target.value;render()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(b.classList.contains('hidden'))return;page=b.dataset.page;render()});
enterApp();
</script>
